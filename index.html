<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BloodBot progress blog</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
body { font-family: Arial, sans-serif; background: #ffd3b6; color: #061627; margin: 0; padding: 40px 20px; line-height: 1.6; }
main { max-width: 860px; margin: 0 auto; }
h1 { font-size: 2.6em; margin: 24px 0 8px; }
.intro { font-size: 1.2em; margin: 0 0 24px; }
.back { background: #061627; color: #ffe700; padding: 12px 24px; border-radius: 50px; text-decoration: none;
        font-weight: bold; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        transition: transform 0.2s ease, box-shadow 0.2s ease; }
.back:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
.post-list { list-style: none; padding: 0; margin: 24px 0; display: grid; gap: 14px; }
.post-list a { display: block; background: #061627; color: #e2e8f0; text-decoration: none; border-radius: 16px;
               padding: 18px 24px; border: 2px solid #061627; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
               transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease; }
.post-list a:hover { transform: translateY(-3px); border-color: #ffe700; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
.post-list .date { display: block; color: #94a3b8; font-size: 0.9em; }
.post-list .title { display: block; color: #ffe700; font-size: 1.3em; font-weight: bold; margin-top: 2px; }
.post-nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 24px 0; }
.post-nav a { color: #061627; font-weight: bold; text-decoration: none; }
.post-nav a:hover { text-decoration: underline; }
article { background: #fff; border-radius: 18px; padding: 28px 36px; margin: 32px 0;
          box-shadow: 0 8px 20px rgba(6,22,39,0.15); border-top: 6px solid #ffe700; overflow-x: auto; }
article h1 { font-size: 1.8em; margin-top: 0; }
article h2 { font-size: 1.3em; margin-top: 28px; }
table { border-collapse: collapse; margin: 12px 0; font-size: 14px; }
th, td { border: 1px solid #d5dde6; padding: 6px 12px; text-align: left; }
th { background: #061627; color: #ffe700; }
thead:not(:has(th:not(:empty))) { display: none; }
tr:nth-child(even) td { background: #f6f8fb; }
blockquote { margin: 12px 0; padding: 8px 16px; border-left: 4px solid #ffe700; background: #fff8d6; border-radius: 0 8px 8px 0; }
code { background: #eef2f7; padding: 1px 5px; border-radius: 4px; }
pre { background: #061627; color: #e2e8f0; padding: 14px; border-radius: 10px; overflow-x: auto; }
pre code { background: none; }
a { color: #0a4a8a; }
.error { background: #fff; padding: 20px; border-radius: 12px; }
</style>
</head>
<body>
<main>
<a href="https://oscaremoran.github.io/" class="back" id="back">&larr; Back to portfolio</a>
<div id="view">Loading&hellip;</div>
</main>
<script>
// The post list lives in blog/README.md's table: | date | [title](file.md) |
// No hash shows the list; #<post-file-name> shows that one post.
let entries = [];

function esc(t) {
    return t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function showList() {
    document.title = 'BloodBot progress blog';
    document.getElementById('back').href = 'https://oscaremoran.github.io/';
    document.getElementById('back').innerHTML = '&larr; Back to portfolio';
    document.getElementById('view').innerHTML = `
        <h1>BloodBot progress blog</h1>
        <p class="intro">A self-learning bot working its way up to the Mindustry map Bloodshed Bastion.</p>
        <ul class="post-list">${entries.map(e => `
            <li><a href="#${e.id}"><span class="date">${esc(e.date)}</span><span class="title">${esc(e.title)}</span></a></li>`).join('')}
        </ul>`;
}

async function showPost(i) {
    const e = entries[i];
    const view = document.getElementById('view');
    document.title = e.title + ' | BloodBot blog';
    document.getElementById('back').href = '#';
    document.getElementById('back').innerHTML = '&larr; All posts';
    const res = await fetch('blog/' + e.file);
    if (!res.ok) throw new Error(res.status);
    // entries are oldest first, so the newer post is i+1
    const older = entries[i - 1], newer = entries[i + 1];
    view.innerHTML = `<article>${marked.parse(await res.text())}</article>
        <div class="post-nav">
            <span>${older ? `<a href="#${older.id}">&larr; ${esc(older.title)}</a>` : ''}</span>
            <span>${newer ? `<a href="#${newer.id}">${esc(newer.title)} &rarr;</a>` : ''}</span>
        </div>`;
}

async function route() {
    const id = location.hash.slice(1);
    const i = entries.findIndex(e => e.id === id);
    try {
        if (i >= 0) await showPost(i); else showList();
    } catch (err) {
        document.getElementById('view').innerHTML = '<p class="error">Couldn\'t load that post.</p>';
    }
    window.scrollTo(0, 0);
}

async function load() {
    try {
        const readme = await (await fetch('blog/README.md')).text();
        entries = [...readme.matchAll(/^\|\s*([\d-]+)\s*\|\s*\[([^\]]+)\]\(([^)]+\.md)\)/gm)]
            .map(m => ({ date: m[1], title: m[2], file: m[3], id: m[3].replace(/\.md$/, '') }));
        entries.reverse();  // README lists newest first; show oldest first
    } catch (err) {
        document.getElementById('view').innerHTML = '<p class="error">Couldn\'t load the posts.</p>';
        return;
    }
    window.addEventListener('hashchange', route);
    route();
}
load();
</script>
</body>
</html>
